{% extends "base.html" %}

{% block title %}Add Doctor{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                <i class="bi bi-person-plus-fill"></i>
                Add Doctor
            </h3>

        </div>

        <div class="card-body">

            <form action="/add_doctor" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Full Name</label>

                        <input type="text"
                               name="full_name"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Gender</label>

                        <select name="gender"
                                class="form-select"
                                required>

                            <option value="">Select Gender</option>

                            <option>Male</option>

                            <option>Female</option>

                            <option>Other</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Specialization</label>

                        <input type="text"
                               name="specialization"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Qualification</label>

                        <input type="text"
                               name="qualification"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Experience (Years)
                        </label>

                        <input type="number"
                               name="experience_years"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Consultation Fee
                        </label>

                        <input type="number"
                               step="0.01"
                               name="consultation_fee"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select name="department_id"
                                class="form-select"
                                required>

                            {% for department in departments %}

                            <option value="{{ department.department_id }}">

                                {{ department.department_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Joining Date
                        </label>

                        <input type="date"
                               name="joining_date"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status"
                            class="form-select">

                        <option>Active</option>

                        <option>Inactive</option>

                    </select>

                </div>

                <button class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Save Doctor

                </button>

                <a href="/doctors"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
