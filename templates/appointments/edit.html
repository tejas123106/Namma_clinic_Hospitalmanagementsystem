{% extends "base.html" %}

{% block title %}Edit Appointment{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3 class="mb-0">
                <i class="bi bi-pencil-square"></i>
                Edit Appointment
            </h3>

        </div>

        <div class="card-body">

            <form action="/appointments/update/{{ appointment.appointment_id }}" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Patient</label>

                        <select name="patient_id" class="form-select" required>

                            {% for patient in patients %}

                            <option value="{{ patient.patient_id }}"
                                {% if patient.patient_id == appointment.patient_id %}selected{% endif %}>

                                {{ patient.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Doctor</label>

                        <select name="doctor_id" class="form-select" required>

                            {% for doctor in doctors %}

                            <option value="{{ doctor.doctor_id }}"
                                {% if doctor.doctor_id == appointment.doctor_id %}selected{% endif %}>

                                {{ doctor.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Appointment Date</label>

                        <input type="date"
                               name="appointment_date"
                               class="form-control"
                               value="{{ appointment.appointment_date }}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Appointment Time</label>

                        <input type="time"
                               name="appointment_time"
                               class="form-control"
                               value="{{ appointment.appointment_time }}"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">Reason</label>

                    <textarea
                        name="reason"
                        class="form-control"
                        rows="3">{{ appointment.reason }}</textarea>

                </div>

                <div class="mb-4">

                    <label class="form-label">Status</label>

                    <select name="status" class="form-select">

                        <option value="Scheduled"
                        {% if appointment.status=="Scheduled" %}selected{% endif %}>
                        Scheduled
                        </option>

                        <option value="Completed"
                        {% if appointment.status=="Completed" %}selected{% endif %}>
                        Completed
                        </option>

                        <option value="Cancelled"
                        {% if appointment.status=="Cancelled" %}selected{% endif %}>
                        Cancelled
                        </option>

                    </select>

                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i>
                    Update Appointment
                </button>

                <a href="/appointments" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
