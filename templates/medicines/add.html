{% extends "base.html" %}

{% block title %}Add Medicine{% endblock %}

{% block content %}

<h2 class="mb-4">Add Medicine</h2>

<form action="/medicines/add" method="POST">

    <div class="mb-3">
        <label class="form-label">Medicine Name</label>
        <input type="text"
               name="medicine_name"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>

        <select name="category" class="form-select" required>

            <option>Tablet</option>
            <option>Capsule</option>
            <option>Syrup</option>
            <option>Injection</option>
            <option>Ointment</option>

        </select>

    </div>

    <div class="mb-3">
        <label class="form-label">Manufacturer</label>
        <input type="text"
               name="manufacturer"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Unit Price</label>
        <input type="number"
               step="0.01"
               name="unit_price"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Stock Quantity</label>
        <input type="number"
               name="stock_quantity"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Manufacture Date</label>
        <input type="date"
               name="manufacture_date"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Expiry Date</label>
        <input type="date"
               name="expiry_date"
               class="form-control"
               required>
    </div>

    <button type="submit" class="btn btn-success">
        Add Medicine
    </button>

    <a href="/medicines" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
