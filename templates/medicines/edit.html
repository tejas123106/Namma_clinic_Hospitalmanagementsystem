{% extends "base.html" %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}

<h2 class="mb-4">Edit Medicine</h2>

<form action="/medicines/update/{{ medicine.medicine_id }}" method="POST">

    <div class="mb-3">
        <label class="form-label">Medicine Name</label>
        <input type="text"
               name="medicine_name"
               class="form-control"
               value="{{ medicine.medicine_name }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>

        <select name="category" class="form-select" required>

            <option value="Tablet" {% if medicine.category=="Tablet" %}selected{% endif %}>Tablet</option>
            <option value="Capsule" {% if medicine.category=="Capsule" %}selected{% endif %}>Capsule</option>
            <option value="Syrup" {% if medicine.category=="Syrup" %}selected{% endif %}>Syrup</option>
            <option value="Injection" {% if medicine.category=="Injection" %}selected{% endif %}>Injection</option>
            <option value="Ointment" {% if medicine.category=="Ointment" %}selected{% endif %}>Ointment</option>

        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Manufacturer</label>
        <input type="text"
               name="manufacturer"
               class="form-control"
               value="{{ medicine.manufacturer }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Unit Price</label>
        <input type="number"
               step="0.01"
               name="unit_price"
               class="form-control"
               value="{{ medicine.unit_price }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Stock Quantity</label>
        <input type="number"
               name="stock_quantity"
               class="form-control"
               value="{{ medicine.stock_quantity }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Manufacture Date</label>
        <input type="date"
               name="manufacture_date"
               class="form-control"
               value="{{ medicine.manufacture_date }}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Expiry Date</label>
        <input type="date"
               name="expiry_date"
               class="form-control"
               value="{{ medicine.expiry_date }}"
               required>
    </div>

    <button type="submit" class="btn btn-primary">
        Update Medicine
    </button>

    <a href="/medicines" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
