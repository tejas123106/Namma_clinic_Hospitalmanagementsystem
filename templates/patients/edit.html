{% extends "base.html" %}

{% block title %}
Edit Patient
{% endblock %}

{% block content %}

<div class="container">

    <h2>Edit Patient</h2>

    <hr>

    <form action="/patients/update/{{ patient.patient_id }}" method="POST">

        <div class="mb-3">

            <label class="form-label">Full Name</label>

            <input type="text"
                   class="form-control"
                   name="full_name"
                   value="{{ patient.full_name }}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Gender</label>

            <select class="form-control"
                    name="gender">

                <option value="Male"
                    {% if patient.gender=="Male" %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if patient.gender=="Female" %}selected{% endif %}>
                    Female
                </option>

                <option value="Other"
                    {% if patient.gender=="Other" %}selected{% endif %}>
                    Other
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Date of Birth</label>

            <input type="date"
                   class="form-control"
                   name="date_of_birth"
                   value="{{ patient.date_of_birth }}"
                   required>

        </div>

        <div class="mb-3">

            <label>Blood Group</label>

            <select class="form-control"
                    name="blood_group">

                {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}

                <option value="{{ bg }}"
                    {% if patient.blood_group==bg %}selected{% endif %}>
                    {{ bg }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-3">

            <label>Phone</label>

            <input type="text"
                   class="form-control"
                   name="phone"
                   value="{{ patient.phone }}"
                   required>

        </div>

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   class="form-control"
                   name="email"
                   value="{{ patient.email }}">

        </div>

        <div class="mb-3">

            <label>Address</label>

            <textarea class="form-control"
                      name="address"
                      rows="3"
                      required>{{ patient.address }}</textarea>

        </div>

        <div class="mb-3">

            <label>Emergency Contact</label>

            <input type="text"
                   class="form-control"
                   name="emergency_contact"
                   value="{{ patient.emergency_contact }}"
                   required>

        </div>

        <button class="btn btn-success">
            Update Patient
        </button>

        <a href="/patients"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
