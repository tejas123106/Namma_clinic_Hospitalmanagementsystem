{% extends "base.html" %}

{% block title %}
Add Patient
{% endblock %}

{% block content %}

<div class="container">

    <h2>Add New Patient</h2>

    <hr>

    <form action="/add_patient" method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text"
                   class="form-control"
                   name="full_name"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>

            <select class="form-control"
                    name="gender"
                    required>

                <option value="">Select Gender</option>

                <option>Male</option>
                <option>Female</option>
                <option>Other</option>

            </select>

        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth</label>

            <input type="date"
                   class="form-control"
                   name="date_of_birth"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Blood Group</label>

            <select class="form-control"
                    name="blood_group"
                    required>

                <option value="">Select Blood Group</option>

                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">Phone</label>

            <input type="text"
                   class="form-control"
                   name="phone"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   name="email">

        </div>

        <div class="mb-3">

            <label class="form-label">Address</label>

            <textarea class="form-control"
                      name="address"
                      rows="3"
                      required></textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">Emergency Contact</label>

            <input type="text"
                   class="form-control"
                   name="emergency_contact"
                   required>

        </div>

        <button class="btn btn-success">
            Add Patient
        </button>

        <a href="/patients"
           class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
